<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    Favicon / app icon (picked up automatically by the Next.js app/icon.svg
    convention). Deliberately simpler than the header LogoMark: at 16px a thin
    monoline envelope turns to mush, so this uses a solid brand tile with a
    filled white card and no sparkle.
  -->
  <defs>
    <linearGradient id="naashirTile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="8" fill="url(#naashirTile)" />

  <!-- card body -->
  <rect x="7" y="10" width="18" height="13" rx="2.5" fill="#ffffff" />
  <!-- flap fold, cut into the white card in the brand rose -->
  <path
    d="M8.6 11.7 L16 17 L23.4 11.7"
    fill="none"
    stroke="#e11d48"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
